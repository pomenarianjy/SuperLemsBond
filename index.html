// --- SCENE 1: BOOT & START PAGE ---
class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }

    preload() {
        // Core Assets
        this.load.image('startmariobond', 'startmariobond.png');
        this.load.image('mariobond', 'mariobond.png');
        this.load.image('mariobondruntoright', 'mariobondruntoright.png');

        this.load.image('bondgirlfinal', 'Bondgirlfinal.png');

        this.load.image('interval', 'interval.png');
        
        // Items & Boosters
        this.load.image('Martini', 'Martini.png');
        this.load.image('Mariogun', 'Mariogun.png');
        this.load.image('Watch', 'Watch.png');
        this.load.image('Pen', 'Pen.png');
        this.load.image('bondcar', 'bondcar.png');
        this.load.image('bondcoin', 'bondcoin.png');
        
        // Enemies
        this.load.image('LeChiffre', 'LeChiffre.png'); // Goomba
        this.load.image('MaxDenbigh', 'MaxDenbigh.png'); // Koopa
        this.load.image('LyutsiferSafin', 'LyutsiferSafin.png'); // Dry Bones
        this.load.image('DominicGreene', 'DominicGreene.png'); // Piranha
        this.load.image('ErnstStavroBlofeld', 'ErnstStavroBlofeld.png'); // Swooper
        this.load.image('RaoulSilva', 'RaoulSilva.png'); // Boss 1
        this.load.image('MrWhite', 'Mr.White.png'); // Boss 2

        // Environment (Fallbacks generated via graphics if images missing)
        this.load.image('block', 'block.png');
        this.load.image('question_block', 'question_block.png');
        this.load.image('flagpole', 'flagpole.png');
    }

    create() {
        // Start Page Logic - FIXED: Proportional scaling without squeezing
        let bg = this.add.image(GAME_WIDTH/2, GAME_HEIGHT/2, 'startmariobond');
        
        // Calculate the scale required to cover the screen without changing proportions
        let scaleX = GAME_WIDTH / bg.width;
        let scaleY = GAME_HEIGHT / bg.height;
        let scale = Math.max(scaleX, scaleY);
        bg.setScale(scale);

        let titleText = this.add.text(GAME_WIDTH/2, 100, '007 LEMS BOND: SUPER BOND', { fontSize: '40px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
        titleText.setAlpha(0);

        let clickCount = 0;
        
        this.input.on('pointerdown', (pointer) => {
            if (clickCount === 0) {
                // First click: Flash title
                this.tweens.add({ targets: titleText, alpha: 1, duration: 500, yoyo: true, repeat: 3 });
                titleText.setAlpha(1);
                clickCount++;
            } else if (clickCount === 1) {
                // Second click: 3 Bullet holes
                clickCount++;
                this.time.delayedCall(100, () => this.add.circle(pointer.x - 50, pointer.y - 50, 30, 0x000000));
                this.time.delayedCall(400, () => this.add.circle(pointer.x + 80, pointer.y + 20, 30, 0x000000));
                this.time.delayedCall(700, () => this.add.circle(pointer.x - 20, pointer.y + 80, 30, 0x000000));
                
                // White smoke swarming up
                this.time.delayedCall(1000, () => {
                    let smoke = this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT + 300, GAME_WIDTH, GAME_HEIGHT + 200, 0xffffff);
                    this.tweens.add({
                        targets: smoke,
                        y: GAME_HEIGHT / 2,
                        duration: 2000,
                        onComplete: () => {
                            this.scene.start('LevelScene', { level: 1 });
                        }
                    });
                });
            }
        });
    }
}
